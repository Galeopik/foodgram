volumes:
  pg_data_foodgram:
    external: true
  static:
  media:
  frontend_build:

services:

  db:
    image: postgres:16
    env_file:
      - .env
    volumes:
      - pg_data_foodgram:/var/lib/postgresql/data

  backend:
    build: ./backend/
    env_file:
      - .env
    volumes:
      - static:/app/collected_static
      - media:/app/media
    depends_on:
      - db

  frontend:
    build: ./frontend/
    env_file:
      - .env
    volumes:
      - frontend_build:/app/result_build

  gateway:
    image: nginx:1.25.4-alpine
    env_file: .env
    ports:
      - "7000:80"
    volumes:
      - static:/static
      - media:/media
      - frontend_build:/usr/share/nginx/html
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend