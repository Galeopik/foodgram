name: Foodgram CI/CD

on:
  push:
    branches:
      - main

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend
        run: docker build -t galeop/foodgram_backend:latest ./backend

      - name: Push backend
        run: docker push galeop/foodgram_backend:latest

      - name: Build frontend
        run: docker build -t galeop/foodgram_frontend:latest ./frontend

      - name: Push frontend
        run: docker push galeop/foodgram_frontend:latest