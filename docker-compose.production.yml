volumes:
  pg_data_foodgram:
    external: true
  static:
  media:
  frontend_build:

services:
  db:
    image: postgres:16
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - pg_data_foodgram:/var/lib/postgresql/data

  backend:
    image: galeop/foodgram_backend:latest
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - static:/app/collected_static
      - media:/app/media
    depends_on:
      - db

  frontend:
    image: galeop/foodgram_frontend:latest
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - frontend_build:/app/result_build

  gateway:
    image: nginx:1.25.4-alpine
    env_file:
      - .env
    ports:
      - "7000:80"
    restart: unless-stopped
    volumes:
      - static:/static
      - media:/media
      - frontend_build:/usr/share/nginx/html
      - ./docs:/usr/share/nginx/html/api/docs
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend